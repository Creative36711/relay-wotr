name: ScriptCat gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: ScriptCat required gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '>=20'
      - run: npm run verify:scriptcat
      - name: Validate workflow YAML with the safe loader
        run: |
          python3 -m pip install --disable-pip-version-check --no-input "PyYAML==6.0.3"
          python3 -c 'import yaml; doc = yaml.safe_load(open(".github/workflows/scriptcat.yml", encoding="utf-8")); assert isinstance(doc, dict), "workflow must be a YAML mapping"'
      - name: Transport Maintainer zone preflight
        run: node tools/script-cat/preflight.mjs --zone "tools/script-cat/**, tools/relay-*.mjs, tools/*.mjs, package.json, .github/**, docs/**, README.md, WARDEN-SCRIPTCAT-MIGRATION.md"
